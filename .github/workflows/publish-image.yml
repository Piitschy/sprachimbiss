name: Publish container image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: piitschy/sprachimbiss

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Call Portainer webhook
        env:
          PORTAINER_WEBHOOK: ${{ vars.PORTAINERWEBHOOK }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          if [ -z "$PORTAINER_WEBHOOK" ]; then
            echo "Repository variable PORTAINERWEBHOOK is not configured."
            exit 1
          fi

          curl --fail --silent --show-error --insecure --retry 3 --retry-delay 2 \
            "${PORTAINER_WEBHOOK}?VERSION=${VERSION_TAG}"
